name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and packaged action
        run: npm run ci

      - name: Verify packaged action is committed
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::The packaged action is out of date. Run 'npm run package' and commit dist/."
            exit 1
          fi
