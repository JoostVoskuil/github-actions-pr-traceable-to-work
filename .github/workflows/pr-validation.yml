name: PR Validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and packaged action
        run: npm run ci

      - name: Verify packaged action is committed
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::The packaged action is out of date. Run 'npm run package' and commit dist/."
            exit 1
          fi
